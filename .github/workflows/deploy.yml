name: Django CD

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/django_todo_cicd
            git pull origin develop
            sudo docker stop django-mlops-containers || true
            sudo docker rm django-mlops-containers || true
            sudo docker build -t django-mlops .
            sudo docker run -d \
              --name django-mlops-containers \
              -p 8000:8000 \
              django-mlops